name: Diagnosticar aba Diário
on:
  push:
    branches: [feature/easter-eggs-five]
    paths:
      - '.github/workflows/diary-tab-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node experiment/diary-smoke.mjs
