name: Validar cinco Easter Eggs na prévia
on:
  push:
    branches: [feature/easter-eggs-five]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar prévia Cloudflare em Chromium
        run: node experiment/browser-check.mjs
      - name: Salvar relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinco-easter-eggs-preview
          path: artifacts/eggs-preview/
          if-no-files-found: warn
