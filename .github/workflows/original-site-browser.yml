name: Validar DOOM no Site Original
on:
  push:
    branches: [feature/doom-easter-egg]
    paths:
      - 'test-browser/original-site-browser.mjs'
      - '.github/workflows/original-site-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-original:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar browser de teste
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validar website original, /doom e tela do jogo
        run: node test-browser/original-site-browser.mjs
      - name: Disponibilizar relatório e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-doom-site-original
          path: artifacts/original/
          if-no-files-found: warn
