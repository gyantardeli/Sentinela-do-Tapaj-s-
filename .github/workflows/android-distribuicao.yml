name: Compilar APK Sentinela Tapajós - teste

on:
  push:
    branches: [main, feat/android-abas-site-20261030]
    paths: ['site/android/**', '.github/workflows/android-distribuicao.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Gerar e validar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirmar Android SDK pré-instalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Instalar Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Isolar pacote de teste do aplicativo principal
        run: |
          cat > /tmp/sentinela-preview.init.gradle <<'EOF'
          gradle.beforeProject { project ->
            if (project.path == ':app') {
              project.plugins.withId('com.android.application') {
                project.android.buildTypes.debug.applicationIdSuffix = '.preview'
                project.android.buildTypes.debug.versionNameSuffix = '-teste'
              }
            }
          }
          EOF
      - name: Validar conformidade das abas Android com o site
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          site=pathlib.Path('site/lib/panel-navigation.ts').read_text()
          app=pathlib.Path('site/android/app/src/main/java/br/com/sentinelatapajos/app/NativeDashboardActivity.java').read_text()
          panel_block=site.split('export const PANELS = [',1)[1].split('] as const;',1)[0]
          actual=re.findall(r'label: "([^"]+)"',panel_block)
          nav=app.split('private static final String[] LABELS={',1)[1].split('};',1)[0]
          android=re.findall(r'"([^"]+)"',nav)
          assert len(actual)==14, f'Esperadas 14 abas no site; encontradas {len(actual)}'
          assert len(android)==15, f'Esperadas 14 abas e Apoie; encontradas {len(android)}'
          assert actual==android[:14], 'Ordem ou nomes das abas divergem do site'
          assert android[14]=='Apoie', 'Apoie deve ficar separado do menu'
          assert 'private void openMenu()' in app and 'private void closeMenu()' in app
          assert 'HorizontalScrollView' not in app
          print('OK: 14 abas idênticas ao site, menu recolhível e Apoie separado.')
          PY
      - name: Compilar APK assinado para testes
        working-directory: site/android
        run: |
          chmod +x gradlew
          ./gradlew -I /tmp/sentinela-preview.init.gradle --no-daemon --stacktrace assembleDebug
      - name: Verificar identificação, assinatura e arquivo
        run: |
          set -eu
          APK=site/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 4
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          if ! "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "name='br.com.sentinelatapajos.app.preview'"; then
            echo "ERRO: pacote de testes não isolado" >&2
            exit 1
          fi
          if "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -E 'android.permission.ACCESS_(FINE|COARSE)_LOCATION'; then
            echo "ERRO: permissão de localização desnecessária" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Sentinela_Tapajos_v1.9.0_Abas_Originais_Beta1.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          cat > dist/LEIA-ME.txt <<'EOF'
          Sentinela Tapajos Android - versao 1.9.0-beta.1 (mapa MapLibre Native)
          Fonte: branch feat/android-abas-site-20261030.
          Pacote: br.com.sentinelatapajos.app.preview
          Menu Android com as mesmas 14 abas e ordem do site + Apoie separado. Requer internet.\n          Mapa nativo MapLibre com INPE/CAMS.\n          Painel Windy oficial embutido + navegadores internos de PurpleAir, IQAir, RadarClima e AccuWeather.\n          Conteudo dos terceiros e web, NAO SDK nativo. Sem 3D real, offline nem escrita administrativa.
          APK de teste, assinado com chave debug do GitHub Actions.
          Instalavel paralelamente ao aplicativo principal.
          NAO e a versao de producao, nem adequada a Play Store.
          A versao publica definitiva precisa ser assinada com
          o keystore original do Sentinela.
          EOF
      - name: Disponibilizar ZIP com APK e comprovantes
        uses: actions/upload-artifact@v4
        with:
          name: Sentinela-Tapajos-Abas-Originais-Beta1
          path: dist/
          if-no-files-found: error
          retention-days: 30
