name: Homologar Diário do Explorador standalone
on:
  push:
    branches: [feature/easter-eggs-five]
    paths:
      - '.github/workflows/diario-playtest-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium e Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar oito capítulos e versão mobile
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import { mkdir, writeFile } from 'node:fs/promises';
          const base='https://sentinela-diario-playtest.gyantardeli.workers.dev/';
          const results=[];
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1365,height:900}});
          const check=async(title,fn)=>{
            try{await fn();results.push({title,ok:true});console.log('PASS '+title);}
            catch(e){results.push({title,ok:false,error:e.message});console.log('FAIL '+title+' '+e.message);}
          };
          await mkdir('artifacts/diario',{recursive:true});
          try{
            await check('Carrega HTML e aplicativo',async()=>{
              const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
              assert.equal(response.status(),200);
              assert.match(await page.title(),/Diário do Explorador/);
              await page.locator('.tab-page').first().waitFor({timeout:10000});
              assert.equal(await page.locator('.tab-page').count(),8);
              const bg=await page.locator('body').evaluate(el=>getComputedStyle(el).backgroundImage);
              assert.match(bg,/data:image\//);
              await page.screenshot({path:'artifacts/diario/desktop.png',fullPage:true});
            });
            await check('Cada uma das oito páginas seleciona corretamente',async()=>{
              for(let i=0;i<8;i++){
                await page.locator('.tab-page').nth(i).click();
                assert.equal(await page.locator('#meta-numero').innerText(),`PÁGINA ${i+1} DE 8`);
                assert.equal(await page.locator('.tab-page[aria-selected="true"]').count(),1);
                assert.equal(await page.locator('.source-card').count(),3);
              }
            });
            await check('Busca e navegação por setas',async()=>{
              await page.locator('#busca-paginas').fill('Fordlândia');
              assert.ok(await page.locator('.tab-page').count()>=1);
              await page.locator('#busca-paginas').fill('');
              await page.locator('.tab-page').first().click();
              await page.locator('#next-page').click();
              assert.match(await page.locator('#page-progress').innerText(),/02 \/ 08/);
              await page.locator('#prev-page').click();
              assert.match(await page.locator('#page-progress').innerText(),/01 \/ 08/);
            });
            await check('Bibliografia contém 24 referências',async()=>{
              await page.locator('#all-sources').click();
              assert.equal(await page.locator('#bibliography-dialog[open]').count(),1);
              assert.equal(await page.locator('#bibliography-content a').count(),24);
              await page.locator('#close-bib').click();
              assert.equal(await page.locator('#bibliography-dialog[open]').count(),0);
            });
            await check('Layout em celular',async()=>{
              await page.setViewportSize({width:390,height:844});
              await page.screenshot({path:'artifacts/diario/celular.png',fullPage:true});
              assert.equal(await page.locator('.tab-page').count(),8);
              const width=await page.evaluate(()=>document.documentElement.scrollWidth);
              assert.ok(width<=410,'layout excedeu viewport '+width);
            });
            await check('Sem operações mutáveis',async()=>{
              const r=await page.request.post(base,{data:{}});
              assert.equal(r.status(),405);
            });
          }finally{
            await writeFile('artifacts/diario/testes.json',JSON.stringify(results,null,2));
            await browser.close();
          }
          if(results.some(x=>!x.ok))process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diario-preview
          path: artifacts/diario
          if-no-files-found: warn
