name: Verificar Sentinela Tapajós
on:
  push:
    branches: ["main", "integracao-v2.2"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe e executar testes
        run: npm run check
