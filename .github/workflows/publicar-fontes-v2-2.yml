name: Publicar arquivos Sentinela V2.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-fontes-v2-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-fontes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar integridade do arquivo
        shell: bash
        run: |
          set -euo pipefail
          echo "88725384295d6043042f948ded8fd4c00b09570bc0cac7db926281af09219087  Sentinela_Tapajos_Repositorio_GitHub_V2_2.zip" | sha256sum -c -
          unzip -t Sentinela_Tapajos_Repositorio_GitHub_V2_2.zip
      - name: Extrair arquivos
        shell: bash
        run: |
          set -euo pipefail
          unzip -o -q Sentinela_Tapajos_Repositorio_GitHub_V2_2.zip
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de regressão
        run: npm run check
      - name: Commit de arquivos extraídos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- . ':!Sentinela_Tapajos_Repositorio_GitHub_V2_2.zip'
          if git diff --cached --quiet; then
            echo "Arquivos já publicados"
            exit 0
          fi
          git commit -m "feat: disponibilizar código-fonte Sentinela Tapajós V2.2"
          git push origin HEAD:main
