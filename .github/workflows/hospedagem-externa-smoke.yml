name: Validar hospedagem externa do Sentinela

on:
  push:
    branches: [sentinela-hospedagem-externa]
    paths:
      - 'site/**'
      - '.github/workflows/hospedagem-externa-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Consultas públicas e proteção de escrita
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BASE_URL: https://sentinela-hospedagem-externa-sentinela-do-tapajos.gyantardeli.workers.dev
    steps:
      - name: Aguardar publicação da revisão com D1
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 35); do
            status=$(curl -sS -L --max-time 15 -o /tmp/access.json -w '%{http_code}' "$BASE_URL/api/access" || true)
            if [ "$status" = "200" ] && jq -e '.publicRead == true and .canManage == false' /tmp/access.json >/dev/null 2>&1; then
              echo "Acesso de leitura pública confirmado."
              exit 0
            fi
            echo "Tentativa $i/35: status $status; aguardando preview com configuração independente."
            sleep 15
          done
          echo "Falha: preview sem acesso público configurado."
          cat /tmp/access.json || true
          exit 1
      - name: Interface e APIs com dados reais
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in "/" "/api/health" "/api/dashboard?place=itaituba"; do
            status=$(curl -sS -L --max-time 65 --retry 2 --retry-delay 4 -o /tmp/sentinela-body -w '%{http_code}' "$BASE_URL$endpoint")
            echo "$endpoint => HTTP $status"
            test "$status" = "200"
          done
      - name: Rejeitar alteração anônima e identidade forjada
        shell: bash
        run: |
          set -euo pipefail
          for kind in anonymous forged; do
            args=()
            if [ "$kind" = "forged" ]; then
              args=(-H "oai-authenticated-user-id: attacker" -H "oai-authenticated-user-email: fake@example.com")
            fi
            code=$(curl -sS --max-time 20 -X POST "${args[@]}" -o /tmp/write.json -w '%{http_code}' "$BASE_URL/api/access")
            echo "$kind => HTTP $code"
            test "$code" = "403"
          done

  production:
    name: Validar endereço principal externo
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BASE_URL: https://sentinela-do-tapajos.gyantardeli.workers.dev
    steps:
      - name: Aguardar atualização completa em produção
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            access=$(curl -sS -L --max-time 15 -o /tmp/access.json -w '%{http_code}' "$BASE_URL/api/access" || true)
            health=$(curl -sS -L --max-time 30 -o /tmp/health.json -w '%{http_code}' "$BASE_URL/api/health" || true)
            if [ "$access" = "200" ] && [ "$health" = "200" ] && jq -e '.publicRead == true and .canManage == false' /tmp/access.json >/dev/null 2>&1; then
              echo "Produção: acesso público e API com sucesso."
              exit 0
            fi
            echo "Tentativa $i/40: access=$access health=$health"
            sleep 15
          done
          exit 1
      - name: Validar painel e consultas reais
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in "/" "/api/dashboard?place=itaituba" "/api/radar"; do
            code=$(curl -sS -L --max-time 65 --retry 2 --retry-delay 4 -o /tmp/response -w '%{http_code}' "$BASE_URL$endpoint")
            echo "$endpoint => HTTP $code"
            test "$code" = "200"
          done
      - name: Verificar escrita administrativa negada
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -X POST \
            -H 'oai-authenticated-user-id: spoofed' \
            -H 'oai-authenticated-user-email: forged@example.com' \
            -o /tmp/write.json -w '%{http_code}' "$BASE_URL/api/access")
          echo "Tentativa de falsificar identidade: HTTP $code"
          test "$code" = "403"
      - name: Verificar bloqueio de login e token falso
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/admin-entry -w '%{http_code}' "$BASE_URL/admin")
          echo "Entrada administrativa sem sessão: HTTP $code"
          test "$code" = "302" -o "$code" = "303" -o "$code" = "401" -o "$code" = "403"
          forged=$(curl -sS --max-time 20 -X POST \
            -H 'Cookie: CF_Authorization=invalid.jwt.signature' \
            -H 'Origin: https://sentinela-do-tapajos.gyantardeli.workers.dev' \
            -o /tmp/forged.json -w '%{http_code}' "$BASE_URL/api/access")
          echo "Token forjado: HTTP $forged"
          test "$forged" = "403"

  typecheck:
    name: Validar TypeScript da autenticação
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Verificar tipos
        run: pnpm run typecheck
