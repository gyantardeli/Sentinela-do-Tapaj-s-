name: Android APK (Sentinela Tapajós)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Plataforma Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK de teste (assinatura DEBUG)
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Publicar arquivo de teste
        uses: actions/upload-artifact@v4
        with:
          name: Sentinela-Tapajos-Site24-APK-TESTE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
