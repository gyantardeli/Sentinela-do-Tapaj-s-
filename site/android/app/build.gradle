plugins { id 'com.android.application' }

android {
    namespace 'br.com.sentinelatapajos.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'br.com.sentinelatapajos.app'
        minSdk 23
        targetSdk 36
        versionCode 7
        versionName '1.5.0'
    }
    def signingFile = rootProject.file('signing.properties')
    if (signingFile.exists()) {
        def values = new Properties()
        signingFile.withInputStream { values.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(values['storeFile'])
                storePassword values['storePassword']
                keyAlias values['keyAlias']
                keyPassword values['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Uses Android framework APIs; no runtime dependencies.
