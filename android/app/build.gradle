plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.sentinelatapajos.mobile'
    compileSdk 35

    defaultConfig {
        // Para ATUALIZAR um APK existente, informe o applicationId REAL do APK anterior.
        applicationId (project.findProperty('sentinelaApplicationId') ?: 'br.com.sentinelatapajos.mobile').toString()
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt((project.findProperty('sentinelaVersionCode') ?: '2401').toString())
        versionName (project.findProperty('sentinelaVersionName') ?: '1.3.0-site24').toString()
    }

    signingConfigs {
        release {
            // Nunca inserir certificado ou senhas no repositório.
            def path = System.getenv('SENTINELA_SIGN_STORE')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('SENTINELA_SIGN_STORE_PASSWORD')
                keyAlias System.getenv('SENTINELA_SIGN_KEY_ALIAS')
                keyPassword System.getenv('SENTINELA_SIGN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
